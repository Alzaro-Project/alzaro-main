<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Alzaro — Platform Admin</title>
  <meta name="description" content="Alzaro platform admin — all users across every vertical." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    :root{
      --bg:#0a0908; --surface:#121110; --surface2:#1a1816; --surface3:#23201d;
      --border:rgba(255,255,255,.06); --border-light:rgba(255,255,255,.1);
      --text:#faf9f7; --text2:#a8a29e; --text3:#68635d;
      --orange:#f97316; --orange-light:#fb923c; --amber:#f59e0b;
      --orange-subtle:rgba(249,115,22,.08);
      --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
      --radius:16px; --radius-sm:8px;
    }
    html[data-theme="light"]{
      --bg:#f7f5f2; --surface:#ffffff; --surface2:#f2efea; --surface3:#e8e3db;
      --border:rgba(0,0,0,.09); --border-light:rgba(0,0,0,.14);
      --text:#1c1a17; --text2:#57534e; --text3:#8a827a;
      --orange:#ea6a10; --orange-light:#c2560c; --amber:#b45309;
      --orange-subtle:rgba(234,106,16,.08);
      --green:#16a34a; --red:#dc2626; --blue:#2563eb;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    html,body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased; transition:background .2s ease, color .2s ease;}
    .mono{font-family:'Fira Code',monospace;}
    ::-webkit-scrollbar{width:8px;height:8px;}
    ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px;}
    a{color:inherit;text-decoration:none;}
    select{font-family:'Manrope',sans-serif;}
    input,button{font-family:'Manrope',sans-serif;}
    .fade-in{animation:fade .5s ease both;}
    @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

    /* ---------- responsive layout ---------- */
    .page{max-width:1180px;margin:0 auto;padding:28px;padding-bottom:calc(28px + env(safe-area-inset-bottom));}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px;}
    .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
    .toolbar .search{flex:1;min-width:200px;}
    .hdr-actions{display:flex;gap:10px;flex-wrap:wrap;}
    .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px;}
    .prod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}

    @media (max-width:720px){
      .page{padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));}
      .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
      .chip-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-left:-14px;margin-right:-14px;padding-left:14px;padding-right:14px;}
      .chip-row::-webkit-scrollbar{display:none;}
      .chip-row button{flex-shrink:0;}
      .hdr-actions button{padding:10px 14px !important;}
      .prod-grid{grid-template-columns:1fr;}
      .card-pad{padding:14px !important;}
    }
  </style>
</head>

  <!-- JSX inlined directly — no external fetch, so the Babel import error cannot occur -->
  <script type="text/babel" data-presets="react">
// ============================================================
//  Alzaro — Platform Admin (unified, all verticals)
//  Security: reads v_platform_users + product_members, both
//  gated by is_platform_admin() RLS. A non-admin session gets
//  no rows and is shown "Access denied". No service key here.
// ============================================================
const { useState, useEffect } = React


// ============================================================
// Product changelog — shown only here in the platform admin.
// Newest entry FIRST. To record a release, prepend an entry:
// { version:'YYYY-MM-DD', date:'DD/MM/YYYY', product:'SoloOps',
//   title:'…', items:[{type:'added|improved|fixed|removed', text:'…'}] }
// ============================================================
const CHANGELOG = [
  { version:'2026-08-26', date:'26/08/2026', product:'Platform', title:'Admin panel refresh', items:[
    { type:'improved', text:'Mobile layout — users show as tap-to-expand cards on phones; table stays on desktop.' },
    { type:'added',    text:'Search box (email or company) and Active/Disabled filter above the user list.' },
    { type:'added',    text:'Basic tier now available in the tier dropdown.' },
    { type:'added',    text:'Delete account (danger zone) — permanently removes the login and all product data, with a typed DELETE confirmation.' },
    { type:'added',    text:'Plan filter and sort options (newest, oldest, recently online, A\u2013Z) on the user list.' },
    { type:'added',    text:'Last-online shown in the user list and per-product plan on the vertical chips.' },
    { type:'added',    text:'Trial extension — edit any client\'s trial end date per product, with quick +7 / +14 / +30 day buttons.' },
    { type:'added',    text:'Light / dark mode toggle in the header, remembered across visits.' },
    { type:'fixed',    text:'Switching away and back to the tab no longer resets to the "Loading platform…" screen.' },

  { version:'2026-08-14', date:'14/08/2026', product:'SoloOps', title:'Slimmer SoloOps', items:[
    { type:'removed',  text:'Banking, Mileage, Documents and Tax pages removed from the app — all underlying data kept; tax now lives inside Reports.' },
    { type:'improved', text:'Dashboard chart follows the selected period (today / week / month / quarter / year / custom range).' },
    { type:'improved', text:'Clients merged into the Items page (Items/Clients); user-facing changelog retired in favour of this admin one.' },
  ]},
  { version:'2026-08-13-6', date:'13/08/2026', product:'SoloOps', title:'Simpler expenses', items:[
    { type:'added',    text:'Attach a receipt directly in the Add expense form.' },
    { type:'added',    text:'"Other" category asks for a short description, shown in the expenses list.' },
    { type:'improved', text:'Clients moved into the Items page.' },
    { type:'removed',  text:'"Saved item" dropdown from Add expense.' },
  ]},
  { version:'2026-08-13-5', date:'13/08/2026', product:'SoloOps', title:'Items', items:[
    { type:'added', text:'Items catalogue — reusable income/expense presets, income items pickable in the invoice form.' },
    { type:'fixed', text:'Suppliers no longer listed in the client dropdown when adding income.' },
  ]},
  { version:'2026-08-13-4', date:'13/08/2026', product:'SoloOps', title:'Layout fix', items:[
    { type:'fixed', text:'Sidebar stays pinned at full height while scrolling.' },
  ]},
  { version:'2026-08-13-3', date:'13/08/2026', product:'SoloOps', title:'Dashboard tidy-up', items:[
    { type:'added',    text:'Custom date range on the dashboard timeline.' },
    { type:'improved', text:'Redundant year dropdown removed from the dashboard.' },
  ]},
  { version:'2026-08-13-2', date:'13/08/2026', product:'SoloOps', title:'View your receipts', items:[
    { type:'added', text:'Attached receipts viewable from the Receipts tab and the receipt tag on expenses.' },
  ]},
  { version:'2026-08-13', date:'13/08/2026', product:'SoloOps', title:'Menu cleanup', items:[
    { type:'removed', text:'Recurring section removed (was a computed view — no data affected).' },
  ]},
]

const VERTICALS = {
  tyreops:     { label: 'TyreOps',     color: 'var(--amber)' },
  garageops:   { label: 'GarageOps',   color: 'var(--orange)' },
  soloops:     { label: 'SoloOps',     color: 'var(--orange-light)' },
  serviceops:  { label: 'ServiceOps',  color: 'var(--blue)' },
  propertyops: { label: 'PropertyOps', color: 'var(--green)' },
}

// Verticals whose app has the /<product>/support landing deployed. Add a
// product here the moment you ship its Support.jsx route — until then the
// button is hidden rather than opening a 404.
const SUPPORT_READY = ['soloops', 'tyreops', 'garageops', 'serviceops', 'propertyops']

// Tier options — every vertical now supports the Basic tier
// (TIER_ORDER includes 'basic' in all five apps).
const DEFAULT_TIERS = ['basic', 'bronze', 'silver', 'gold']
const TIERS_BY_PRODUCT = {}
const tiersFor = product => TIERS_BY_PRODUCT[product] || DEFAULT_TIERS

const gbp = n => (n === null || n === undefined) ? '—' : new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n)
const fmtNum = n => (n === null || n === undefined) ? '—' : n.toLocaleString('en-GB')
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—'
const fmtDateTime = d => d ? new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'
// "2h ago" style for the last-online column
const timeAgo = d => {
  if (!d) return 'Never'
  const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000)
  if (s < 60) return 'Just now'
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago'
  const h = Math.floor(m / 60); if (h < 24) return h + 'h ago'
  const days = Math.floor(h / 24); if (days < 30) return days + 'd ago'
  const mo = Math.floor(days / 30); if (mo < 12) return mo + 'mo ago'
  return Math.floor(mo / 12) + 'y ago'
}
const card = { background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'16px', padding:'22px' }
const btnSec = { background:'var(--surface2)', color:'var(--text)', fontWeight:700, fontSize:'13px', padding:'9px 14px', borderRadius:'10px', border:'1px solid var(--border-light)', cursor:'pointer' }
const td = { padding:'13px 14px', borderBottom:'1px solid var(--border)', fontSize:'13.5px', verticalAlign:'middle' }

// Tracks the <720px breakpoint so the user list can switch table ⇄ cards.
function useIsMobile() {
  const [m, setM] = useState(window.matchMedia('(max-width: 720px)').matches)
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 720px)')
    const fn = e => setM(e.matches)
    mq.addEventListener ? mq.addEventListener('change', fn) : mq.addListener(fn)
    return () => { mq.removeEventListener ? mq.removeEventListener('change', fn) : mq.removeListener(fn) }
  }, [])
  return m
}

function Platform() {
  const isMobile = useIsMobile()
  // theme: 'dark' | 'light', remembered across visits
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('alzaro-platform-theme') || 'dark' } catch { return 'dark' }
  })
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme)
    try { localStorage.setItem('alzaro-platform-theme', theme) } catch {}
  }, [theme])
  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark')

  const [session, setSession] = useState(undefined)
  const [allowed, setAllowed] = useState(undefined) // undefined=checking, false=denied, true=admin
  const [loading, setLoading] = useState(true)
  const [refreshing, setRefreshing] = useState(false)
  const [loadErr, setLoadErr] = useState('') // visible error when the user list fails to load
  const [users, setUsers] = useState([])
  const [filter, setFilter] = useState('all')
  const [statusFilter, setStatusFilter] = useState('all') // all | active | disabled
  const [planFilter, setPlanFilter] = useState('all') // all | basic | bronze | silver | gold
  const [sortBy, setSortBy] = useState('newest') // newest | oldest | recent-online | email
  const [search, setSearch] = useState('')
  const [busy, setBusy] = useState(null) // user_id currently toggling
  const [planBusy, setPlanBusy] = useState(null) // user_id+product currently saving plan
  const [expanded, setExpanded] = useState(null) // user_id currently expanded
  const [showAdmins, setShowAdmins] = useState(false)
  const [toast, setToast] = useState('') // transient error/info message

  const showToast = (msg) => {
    setToast(msg)
    clearTimeout(showToast._t)
    showToast._t = setTimeout(() => setToast(''), 4500)
  }

  // call the admin-users edge function with the current session token
  const callFn = async (body) => {
    const { data: { session } } = await window.sb.auth.getSession()
    const res = await fetch(`${window.SB_FN_URL}/admin-users`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session?.access_token}`,
      },
      body: JSON.stringify(body || {}),
    })
    return res.json()
  }

  // login form state
  const [email, setEmail] = useState('')
  const [pw, setPw] = useState('')
  const [loginErr, setLoginErr] = useState('')
  const [loggingIn, setLoggingIn] = useState(false)

  useEffect(() => {
    window.sb.auth.getSession().then(({ data }) => setSession(data.session || null))
    // Only react to a genuine change of signed-in user. Supabase also fires
    // this on tab refocus (TOKEN_REFRESHED / SIGNED_IN with the same user),
    // which would otherwise re-trigger the full-screen loader every time you
    // switch back to the tab. Compare user ids and ignore no-op events.
    const { data: sub } = window.sb.auth.onAuthStateChange((event, s) => {
      if (event === 'TOKEN_REFRESHED') return // silent token refresh — keep everything as-is
      setSession(prev => {
        const prevId = prev && prev.user ? prev.user.id : null
        const nextId = s && s.user ? s.user.id : null
        if (prevId === nextId) return prev // same user (or still logged out) — no change
        return s
      })
    })
    return () => sub.subscription.unsubscribe()
  }, [])

  // verify admin + load all users — runs once per real login, keyed on user id
  const checkedFor = React.useRef(null)
  useEffect(() => {
    if (session === undefined) return
    const uid = session && session.user ? session.user.id : null
    if (uid === null) { checkedFor.current = null; setAllowed(undefined); setLoading(false); return }
    if (checkedFor.current === uid) return // already verified this user; don't re-loop on refocus
    checkedFor.current = uid
    const run = async () => {
      setLoading(true)
      const { data: isAdmin, error } = await window.sb.rpc('is_platform_admin')
      if (error || !isAdmin) { setAllowed(false); setLoading(false); return }
      setAllowed(true)
      await loadUsers()
      setLoading(false)
    }
    run()
  }, [session])

  const loadUsers = async () => {
    setLoadErr('')
    setRefreshing(true)
    try {
      const res = await callFn({ action: 'list' })
      if (res && res.users) setUsers(res.users)
      else setLoadErr((res && res.error) || 'The server returned no data.')
    } catch (e) {
      setLoadErr('Network error — check your connection and try again.')
    }
    setRefreshing(false)
  }

  const doLogin = async () => {
    setLoginErr(''); setLoggingIn(true)
    const { error } = await window.sb.auth.signInWithPassword({ email: email.trim(), password: pw })
    setLoggingIn(false)
    if (error) setLoginErr(error.message)
  }

  const signOut = async () => { await window.sb.auth.signOut(); setUsers([]); setAllowed(undefined) }

  // toggle disable/enable via edge function (real ban + status flag)
  const toggleDisabled = async (u) => {
    const disable = !u.is_disabled
    if (disable && !confirm(`Disable ${u.email}? They will be blocked from logging in to all Alzaro products. This is reversible.`)) return
    setBusy(u.user_id)
    const res = await callFn({ action: disable ? 'disable' : 'enable', user_id: u.user_id }).catch(() => ({ error: 'Network error' }))
    setBusy(null)
    if (res && res.error) { showToast('Failed: ' + res.error); return }
    await loadUsers()
  }

  // permanently delete an account + all product data (server-side, service role)
  const [deleteBusy, setDeleteBusy] = useState(null)
  const deleteUser = async (u) => {
    if (!confirm(`Permanently delete ${u.email}?\n\nThis removes their login and ALL their data in every Alzaro product. This cannot be undone.`)) return
    const typed = prompt(`Type DELETE to confirm wiping ${u.email}:`)
    if (typed !== 'DELETE') { if (typed !== null) showToast('Not deleted — you must type DELETE exactly.'); return }
    setDeleteBusy(u.user_id)
    const res = await callFn({ action: 'delete-user', user_id: u.user_id }).catch(() => ({ error: 'Network error' }))
    setDeleteBusy(null)
    if (res && res.error) { showToast('Failed: ' + res.error); return }
    setExpanded(null)
    showToast(`${u.email} deleted.`)
    await loadUsers()
  }

  // ---- support access ("View client portal") ----------------------------
  // Opens the customer's own app as them, so we can finish a setup for them or
  // reproduce a fault they've reported. Sessions are still recorded in
  // platform_support_sessions — the server fills in a standard reason.
  const [supportBusy, setSupportBusy] = useState(null) // user_id+product opening

  const openClientPortal = async (u, product) => {
    const { data: { session } } = await window.sb.auth.getSession()
    const res = await fetch('/api/admin-impersonate', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session?.access_token}`,
      },
      body: JSON.stringify({ action: 'start', user_id: u.user_id, product }),
    }).then(r => r.json()).catch(() => ({ error: 'Network error' }))

    if (!res || res.error || !res.token_hash) {
      return res?.error || 'Could not start the session'
    }

    // Token travels in the URL fragment — fragments are never sent to a server,
    // so it stays out of request logs and the Referer header.
    const frag = new URLSearchParams({
      tk: res.token_hash,
      sid: res.session_id,
      admin: session?.user?.email || '',
      email: res.email || u.email || '',
      exp: String(new Date(res.expires_at).getTime()),
    }).toString()

    window.open(`/${product}/support#${frag}`, '_blank', 'noopener')
    return null
  }

  // update tier/status for one vertical
  const setPlan = async (u, product, patch) => {
    setPlanBusy(u.user_id + product)
    const res = await callFn({ action: 'set-plan', user_id: u.user_id, product, ...patch }).catch(() => ({ error: 'Network error' }))
    setPlanBusy(null)
    if (res && res.error) { showToast('Failed: ' + res.error); return }
    await loadUsers()
  }

  // ---------- render states ----------

  if (session === undefined || (session && loading))
    return <Center>Loading platform…</Center>

  // not logged in → login form
  if (session === null) {
    return (
      <Center>
        <div style={{ width:'100%', maxWidth:'360px' }} className="fade-in">
          <div style={{ fontSize:'22px', fontWeight:800, marginBottom:'4px' }}>
            Alzaro <span style={{color:'var(--orange)'}}>Platform</span>
          </div>
          <div style={{ color:'var(--text3)', fontSize:'13px', marginBottom:'22px' }}>Admin access only</div>
          <Field label="Email" value={email} onChange={setEmail} type="email" onEnter={doLogin} autoComplete="username" />
          <Field label="Password" value={pw} onChange={setPw} type="password" onEnter={doLogin} autoComplete="current-password" />
          {loginErr && <div style={{ color:'var(--red)', fontSize:'13px', margin:'4px 0 12px' }}>{loginErr}</div>}
          <button onClick={doLogin} disabled={loggingIn}
            style={{ width:'100%', background:'linear-gradient(135deg, var(--orange), var(--amber))', color:'#fff', fontWeight:800, fontSize:'14px', padding:'12px', borderRadius:'10px', border:'none', cursor:'pointer', marginTop:'6px', opacity: loggingIn?0.6:1 }}>
            {loggingIn ? 'Signing in…' : 'Sign in'}
          </button>
        </div>
      </Center>
    )
  }

  // logged in but not a platform admin
  if (allowed === false)
    return (
      <Center>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontSize:'18px', fontWeight:800, marginBottom:'8px' }}>Access denied</div>
          <div style={{ color:'var(--text2)', fontSize:'14px', marginBottom:'18px' }}>
            {session.user.email} is not a platform admin.
          </div>
          <button onClick={signOut} style={btnSec}>Sign out</button>
        </div>
      </Center>
    )

  // ---------- admin view ----------
  const total = users.length
  const disabledCount = users.filter(u => u.is_disabled).length
  const perVertical = Object.keys(VERTICALS).reduce((acc, k) => {
    acc[k] = users.filter(u => (u.verticals || '').includes(k)).length
    return acc
  }, {})

  // filter: vertical chip → status → search (email or any company name)
  const q = search.trim().toLowerCase()
  const shown = users.filter(u => {
    if (filter !== 'all' && !(u.verticals || '').includes(filter)) return false
    if (statusFilter === 'active' && u.is_disabled) return false
    if (statusFilter === 'disabled' && !u.is_disabled) return false
    if (planFilter !== 'all') {
      // when a vertical chip is picked, match the plan on THAT product; otherwise any product
      const ms = (u.memberships || []).filter(m => filter === 'all' || m.product === filter)
      if (!ms.some(m => (m.tier || '') === planFilter)) return false
    }
    if (q) {
      const companies = (u.memberships || []).map(m => m.company_name || '').join(' ').toLowerCase()
      if (!(u.email || '').toLowerCase().includes(q) && !companies.includes(q)) return false
    }
    return true
  }).sort((a, b) => {
    if (sortBy === 'oldest') return new Date(a.created_at) - new Date(b.created_at)
    if (sortBy === 'recent-online') return new Date(b.last_sign_in_at || 0) - new Date(a.last_sign_in_at || 0)
    if (sortBy === 'email') return (a.email || '').localeCompare(b.email || '')
    return new Date(b.created_at) - new Date(a.created_at) // newest
  })

  // Shared expanded-detail block, used by both the desktop table row and the
  // mobile card so behaviour stays identical.
  const ExpandedDetail = ({ u, showDisable }) => (
    <div>
      <div className="detail-grid">
        <Detail label="Joined" value={fmtDate(u.created_at)} />
        <Detail label="Last logged in" value={u.last_sign_in_at ? fmtDateTime(u.last_sign_in_at) : 'Never'} />
        <Detail label="Email confirmed" value={u.email_confirmed_at ? fmtDate(u.email_confirmed_at) : 'No'} />
        <Detail label="Account" value={u.is_disabled ? 'Disabled' : 'Active'} color={u.is_disabled?'var(--red)':'var(--green)'} />
      </div>
      <div style={{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--text3)', fontWeight:700, marginBottom:'10px' }}>Products ({(u.memberships||[]).length})</div>
      <div className="prod-grid">
        {(u.memberships||[]).map((m,i) => {
          const meta = VERTICALS[m.product] || { label:m.product, color:'var(--text3)' }
          return (
            <div key={i} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'12px', padding:'14px' }}>
              <div style={{ fontWeight:800, color:meta.color, marginBottom:'10px' }}>{meta.label}</div>
              <Row k="Company" v={m.company_name || '—'} />
              <TrialEditor
                value={m.trial_ends}
                busy={planBusy===u.user_id+m.product}
                onSave={val=>setPlan(u, m.product, { trial_ends: val })} />
              {m.usage && (
                <div style={{ marginTop:'10px', paddingTop:'10px', borderTop:'1px solid var(--border)', display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px' }}>
                  <Metric label="Customers" value={fmtNum(m.usage.customers)} />
                  {m.usage.inventory !== null && <Metric label="Inventory" value={fmtNum(m.usage.inventory)} />}
                  <Metric label="Invoices" value={fmtNum(m.usage.invoices)} />
                  {m.usage.revenue !== null && <Metric label="Revenue" value={gbp(m.usage.revenue)} color="var(--green)" />}
                </div>
              )}
              <div style={{ marginTop:'10px', display:'grid', gap:'8px' }}>
                <PlanSelect label="Tier" value={m.tier || 'bronze'} options={tiersFor(m.product)}
                  disabled={planBusy===u.user_id+m.product}
                  onChange={val=>setPlan(u, m.product, { tier: val })} />
                <PlanSelect label="Status" value={m.status || 'trial'} options={['trial','active','suspended','disabled']}
                  disabled={planBusy===u.user_id+m.product}
                  onChange={val=>setPlan(u, m.product, { status: val })} />
              </div>
              {SUPPORT_READY.includes(m.product) ? (
                <button
                  onClick={async (e)=>{
                    e.stopPropagation()
                    setSupportBusy(u.user_id + m.product)
                    const failure = await openClientPortal(u, m.product)
                    setSupportBusy(null)
                    if (failure) showToast('Could not open the portal: ' + failure)
                  }}
                  disabled={u.is_disabled || supportBusy === u.user_id + m.product}
                  title={u.is_disabled ? 'Enable the account first' : `Open ${m.product} as ${u.email}`}
                  style={{ ...btnSec, width:'100%', marginTop:'10px', padding:'10px', color: u.is_disabled ? 'var(--text3)' : 'var(--orange-light)', borderColor: u.is_disabled ? 'var(--border)' : 'rgba(249,115,22,.35)', cursor: u.is_disabled ? 'not-allowed' : 'pointer', opacity: (u.is_disabled || supportBusy === u.user_id + m.product) ? 0.5 : 1 }}>
                  {supportBusy === u.user_id + m.product ? 'Opening…' : 'View client portal ↗'}
                </button>
              ) : (
                <div style={{ marginTop:'10px', fontSize:'11.5px', color:'var(--text3)', textAlign:'center' }}>
                  Portal access not enabled for {meta.label} yet
                </div>
              )}
            </div>
          )
        })}
      </div>

      {/* danger zone */}
      <div style={{ marginTop:'16px', paddingTop:'14px', borderTop:'1px solid rgba(239,68,68,.2)', display:'flex', gap:'10px', alignItems:'center', flexWrap:'wrap' }}>
        <span style={{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--red)', fontWeight:700, flex:1, minWidth:'120px' }}>Danger zone</span>
        {showDisable && <DisableBtn u={u} />}
        <button
          onClick={(e)=>{ e.stopPropagation(); deleteUser(u) }}
          disabled={deleteBusy === u.user_id}
          style={{ ...btnSec, padding:'9px 14px', background:'rgba(239,68,68,.1)', color:'var(--red)', borderColor:'rgba(239,68,68,.35)', opacity: deleteBusy === u.user_id ? 0.5 : 1 }}>
          {deleteBusy === u.user_id ? 'Deleting…' : 'Delete account'}
        </button>
      </div>
    </div>
  )

  const VerticalChips = ({ u }) => (
    <div style={{ display:'flex', gap:'6px', flexWrap:'wrap' }}>
      {(u.memberships || []).map((m, i) => {
        const meta = VERTICALS[m.product] || { label:m.product, color:'var(--text3)' }
        return (
          <span key={i} style={{ fontSize:'11px', fontWeight:700, padding:'3px 8px', borderRadius:'6px', background:'var(--surface2)', color:meta.color, border:'1px solid var(--border-light)' }}>
            {meta.label}{m.tier ? <span style={{ color:'var(--text3)', fontWeight:600 }}> · {m.tier}</span> : null}
          </span>
        )
      })}
    </div>
  )

  const DisableBtn = ({ u, full }) => (
    <button
      onClick={(e)=>{ e.stopPropagation(); toggleDisabled(u) }}
      disabled={busy===u.user_id}
      style={{
        ...btnSec, padding: full ? '10px' : '7px 13px', width: full ? '100%' : undefined,
        color: u.is_disabled ? 'var(--green)' : 'var(--red)',
        borderColor: u.is_disabled ? 'rgba(34,197,94,.3)' : 'rgba(239,68,68,.3)',
        opacity: busy===u.user_id ? 0.5 : 1
      }}>
      {busy===u.user_id ? '…' : (u.is_disabled ? 'Enable' : 'Disable')}
    </button>
  )

  return (
    <div className="page fade-in">
      {/* header */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'20px', flexWrap:'wrap', gap:'12px' }}>
        <div>
          <div style={{ fontSize:'22px', fontWeight:800 }}>Alzaro <span style={{color:'var(--orange)'}}>Platform</span> · Admin</div>
          <div style={{ color:'var(--text3)', fontSize:'13px' }}>{session.user.email}</div>
        </div>
        <div className="hdr-actions">
          <button onClick={toggleTheme} title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'} style={btnSec}>{theme === 'dark' ? '☀' : '☾'}</button>
          <button onClick={loadUsers} disabled={refreshing} style={{...btnSec, opacity: refreshing?0.6:1}}>{refreshing ? '↻ …' : '↻ Refresh'}</button>
          <button onClick={()=>setShowAdmins(true)} style={{...btnSec, color:'var(--orange-light)', borderColor:'rgba(249,115,22,.3)'}}>+ Admins</button>
          <button onClick={signOut} style={btnSec}>Sign out</button>
        </div>
      </div>

      {/* load error banner */}
      {loadErr && (
        <div style={{ background:'rgba(239,68,68,.08)', border:'1px solid rgba(239,68,68,.3)', borderRadius:'12px', padding:'12px 14px', marginBottom:'16px', display:'flex', alignItems:'center', gap:'12px', flexWrap:'wrap' }}>
          <span style={{ color:'var(--red)', fontSize:'13.5px', fontWeight:600, flex:1, minWidth:'180px' }}>Couldn't load users: {loadErr}</span>
          <button onClick={loadUsers} style={{...btnSec, padding:'7px 13px'}}>Retry</button>
        </div>
      )}

      {/* stat cards */}
      <div className="stat-grid">
        <Stat label="Total users" value={total} />
        <Stat label="Disabled" value={disabledCount} color={disabledCount? 'var(--red)':'var(--text)'} />
        {Object.entries(VERTICALS).map(([k,v]) =>
          <Stat key={k} label={v.label} value={perVertical[k]} color={v.color} />
        )}
      </div>

      {/* vertical filter chips */}
      <div className="chip-row">
        <Chip active={filter==='all'} onClick={()=>setFilter('all')}>All ({total})</Chip>
        {Object.entries(VERTICALS).map(([k,v]) =>
          <Chip key={k} active={filter===k} onClick={()=>setFilter(k)} color={v.color}>
            {v.label} ({perVertical[k]})
          </Chip>
        )}
      </div>

      {/* search + status filter */}
      <div className="toolbar">
        <input
          className="search"
          value={search}
          onChange={e=>setSearch(e.target.value)}
          placeholder="Search email or company…"
          style={{ background:'var(--surface)', border:'1px solid var(--border-light)', borderRadius:'10px', padding:'11px 13px', color:'var(--text)', fontSize:'14px' }}
        />
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}
          style={{ background:'var(--surface)', color:'var(--text)', border:'1px solid var(--border-light)', borderRadius:'10px', padding:'11px 10px', fontSize:'13.5px', fontWeight:600, cursor:'pointer' }}>
          <option value="all">All statuses</option>
          <option value="active">Active only</option>
          <option value="disabled">Disabled only</option>
        </select>
        <select value={planFilter} onChange={e=>setPlanFilter(e.target.value)}
          style={{ background:'var(--surface)', color:'var(--text)', border:'1px solid var(--border-light)', borderRadius:'10px', padding:'11px 10px', fontSize:'13.5px', fontWeight:600, cursor:'pointer' }}>
          <option value="all">All plans</option>
          <option value="basic">Basic</option>
          <option value="bronze">Bronze</option>
          <option value="silver">Silver</option>
          <option value="gold">Gold</option>
        </select>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
          style={{ background:'var(--surface)', color:'var(--text)', border:'1px solid var(--border-light)', borderRadius:'10px', padding:'11px 10px', fontSize:'13.5px', fontWeight:600, cursor:'pointer' }}>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="recent-online">Recently online</option>
          <option value="email">Email A–Z</option>
        </select>
      </div>

      {/* users */}
      <div style={card} className="card-pad">
        <div style={{ fontWeight:700, marginBottom:'16px' }}>
          {filter==='all' ? 'Users' : VERTICALS[filter].label + ' users'}
          <span style={{ color:'var(--text3)', fontWeight:600, fontSize:'13px', marginLeft:'8px' }}>{shown.length} of {total}</span>
        </div>

        {shown.length===0 ? (
          <div style={{ color:'var(--text3)', padding:'24px', textAlign:'center' }}>
            {q || statusFilter !== 'all' || planFilter !== 'all' ? 'No users match these filters.' : 'No users.'}
          </div>
        ) : isMobile ? (
          /* ---------- mobile: tap-to-expand cards ---------- */
          <div style={{ display:'grid', gap:'10px' }}>
            {shown.map(u => {
              const open = expanded === u.user_id
              return (
                <div key={u.user_id} style={{ background: open ? 'var(--surface2)' : 'var(--surface)', border:'1px solid var(--border)', borderRadius:'12px', opacity: u.is_disabled ? 0.6 : 1 }}>
                  <div onClick={()=>setExpanded(open ? null : u.user_id)} style={{ padding:'13px 14px', cursor:'pointer' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:'8px', marginBottom:'8px' }}>
                      <span style={{ fontSize:'14px', fontWeight:700, wordBreak:'break-all' }}>{u.email}</span>
                      <span style={{ color:'var(--text3)', flexShrink:0 }}>{open ? '▾' : '▸'}</span>
                    </div>
                    <VerticalChips u={u} />
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'10px' }}>
                      {u.is_disabled
                        ? <span style={{ color:'var(--red)', fontWeight:700, fontSize:'12px' }}>● Disabled</span>
                        : <span style={{ color:'var(--green)', fontWeight:700, fontSize:'12px' }}>● Active</span>}
                      <span style={{ color:'var(--text3)', fontSize:'12px' }}>Online {timeAgo(u.last_sign_in_at)} · Joined {fmtDate(u.created_at)}</span>
                    </div>
                  </div>
                  {open && (
                    <div style={{ padding:'0 14px 14px', borderTop:'1px solid var(--border)', paddingTop:'14px' }}>
                      <ExpandedDetail u={u} showDisable />
                    </div>
                  )}
                </div>
              )
            })}
          </div>
        ) : (
          /* ---------- desktop: table ---------- */
          <div style={{ overflowX:'auto' }}>
            <table style={{ width:'100%', borderCollapse:'collapse', minWidth:'720px' }}>
              <thead><tr>
                {['','Email','Products · plan','Joined','Last online','Status',''].map((h,i)=>(
                  <th key={i} style={{ textAlign:'left', fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.6px', color:'var(--text3)', fontWeight:700, padding:'0 14px 12px', borderBottom:'1px solid var(--border)' }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {shown.map(u => {
                  const open = expanded === u.user_id
                  return (
                  <React.Fragment key={u.user_id}>
                  <tr
                    onClick={()=>setExpanded(open ? null : u.user_id)}
                    style={{ opacity: u.is_disabled ? 0.55 : 1, cursor:'pointer', background: open ? 'var(--surface2)' : 'transparent' }}>
                    <td style={{...td, width:'30px', color:'var(--text3)'}}>{open ? '▾' : '▸'}</td>
                    <td style={td}>{u.email}</td>
                    <td style={td}><VerticalChips u={u} /></td>
                    <td style={{...td, color:'var(--text3)'}}>{fmtDate(u.created_at)}</td>
                    <td style={{...td, color:'var(--text2)'}} title={u.last_sign_in_at ? fmtDateTime(u.last_sign_in_at) : 'Never logged in'}>{timeAgo(u.last_sign_in_at)}</td>
                    <td style={td}>
                      {u.is_disabled
                        ? <span style={{ color:'var(--red)', fontWeight:700, fontSize:'12px' }}>● Disabled</span>
                        : <span style={{ color:'var(--green)', fontWeight:700, fontSize:'12px' }}>● Active</span>}
                    </td>
                    <td style={{...td, textAlign:'right'}}><DisableBtn u={u} /></td>
                  </tr>
                  {open && (
                    <tr>
                      <td colSpan={7} style={{ padding:'14px 14px 18px', background:'var(--surface2)', borderBottom:'1px solid var(--border)' }}>
                        <ExpandedDetail u={u} />
                      </td>
                    </tr>
                  )}
                  </React.Fragment>
                )})}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <Changelog />

      {showAdmins && <AdminModal callFn={callFn} onClose={()=>{ setShowAdmins(false); loadUsers() }} />}

      {/* transient error toast */}
      {toast && (
        <div style={{ position:'fixed', bottom:'22px', left:'50%', transform:'translateX(-50%)', background:'var(--surface3)', border:'1px solid rgba(239,68,68,.35)', color:'var(--text)', borderRadius:'12px', padding:'11px 16px', fontSize:'13px', fontWeight:600, zIndex:1100, maxWidth:'92vw', boxShadow:'0 8px 24px rgba(0,0,0,.45)', animation:'toastIn .25s ease both' }}>
          {toast}
        </div>
      )}
    </div>
  )
}

// ---------- small components ----------
function Center({children}) { return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)',padding:'20px'}}>{children}</div> }
function Changelog() {
  const TYPES = {
    added:    { label:'Added',    color:'var(--green)',  bg:'rgba(34,197,94,.12)' },
    improved: { label:'Improved', color:'var(--blue)',   bg:'rgba(59,130,246,.12)' },
    fixed:    { label:'Fixed',    color:'var(--amber)',  bg:'rgba(245,158,11,.12)' },
    removed:  { label:'Removed',  color:'var(--text3)',  bg:'var(--surface3)' },
  }
  return (
    <div style={{...card, marginTop:'16px'}} className="card-pad">
      <div style={{ fontWeight:700, marginBottom:'4px' }}>Changelog</div>
      <div style={{ color:'var(--text3)', fontSize:'12.5px', marginBottom:'18px' }}>Product release notes — edit the CHANGELOG list at the top of this file to add entries.</div>
      {CHANGELOG.map(e => (
        <div key={e.version} style={{ borderTop:'1px solid var(--border)', padding:'14px 0' }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:'10px', flexWrap:'wrap', marginBottom:'10px' }}>
            <span style={{ fontSize:'11px', fontWeight:700, color:'var(--orange-light)', background:'var(--orange-subtle)', padding:'2px 8px', borderRadius:'6px' }}>{e.product}</span>
            <span style={{ fontWeight:700, fontSize:'14px' }}>{e.title}</span>
            <span className="mono" style={{ fontSize:'12px', color:'var(--text3)', marginLeft:'auto' }}>{e.date}</span>
          </div>
          {e.items.map((it,i) => {
            const t = TYPES[it.type] || TYPES.improved
            return (
              <div key={i} style={{ display:'flex', gap:'10px', alignItems:'flex-start', fontSize:'13px', color:'var(--text2)', lineHeight:1.55, marginBottom:'8px' }}>
                <span style={{ padding:'1px 7px', borderRadius:'6px', fontSize:'10px', fontWeight:700, textTransform:'uppercase', letterSpacing:'.5px', color:t.color, background:t.bg, flexShrink:0, marginTop:'2px' }}>{t.label}</span>
                <span>{it.text}</span>
              </div>
            )
          })}
        </div>
      ))}
    </div>
  )
}

function Stat({label,value,color}) { return <div style={{...card, padding:'18px'}}><div style={{fontSize:'11px',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.6px',fontWeight:600}}>{label}</div><div style={{fontSize:'24px',fontWeight:600,marginTop:'6px',letterSpacing:'-0.5px',color:color||'var(--orange-light)',fontFamily:'Fira Code, monospace'}}>{value}</div></div> }
function Detail({label,value,color}) { return <div><div style={{fontSize:'11px',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.5px',fontWeight:600,marginBottom:'3px'}}>{label}</div><div style={{fontSize:'14px',fontWeight:600,color:color||'var(--text)'}}>{value}</div></div> }
function Row({k,v}) { return <div style={{display:'flex',justifyContent:'space-between',fontSize:'12.5px',padding:'3px 0'}}><span style={{color:'var(--text3)'}}>{k}</span><span style={{color:'var(--text2)',fontWeight:600,textAlign:'right'}}>{v}</span></div> }
function Metric({label,value,color}) { return <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'8px',padding:'8px 10px'}}><div style={{fontSize:'10px',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.5px',fontWeight:700,marginBottom:'2px'}}>{label}</div><div style={{fontSize:'15px',fontWeight:700,color:color||'var(--text)',fontFamily:'Fira Code, monospace'}}>{value}</div></div> }
// Editable trial end date with quick-extend buttons. Saves via set-plan.
function TrialEditor({ value, onSave, busy }) {
  const toInput = d => d ? new Date(d).toISOString().slice(0,10) : ''
  const [val, setVal] = useState(toInput(value))
  useEffect(() => { setVal(toInput(value)) }, [value])
  const dirty = val !== toInput(value)

  // extend from the current trial end if it's in the future, else from today
  const extend = (days) => {
    const base = value && new Date(value) > new Date() ? new Date(value) : new Date()
    base.setDate(base.getDate() + days)
    const iso = base.toISOString().slice(0,10)
    setVal(iso)
    onSave(iso)
  }

  const quick = { fontSize:'11px', fontWeight:700, padding:'5px 8px', borderRadius:'6px', border:'1px solid var(--border-light)', background:'var(--surface2)', color:'var(--text2)', cursor:'pointer' }

  return (
    <div style={{ padding:'6px 0' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px', marginBottom:'6px' }}>
        <span style={{ fontSize:'12.5px', color:'var(--text3)' }}>Trial ends</span>
        <input type="date" value={val} disabled={busy}
          onChange={e=>setVal(e.target.value)}
          style={{ background:'var(--surface2)', color:'var(--text)', border:'1px solid var(--border-light)', borderRadius:'8px', padding:'6px 8px', fontSize:'12.5px', fontWeight:600, fontFamily:'Manrope, sans-serif', colorScheme: document.documentElement.getAttribute('data-theme')==='light'?'light':'dark', opacity:busy?0.5:1 }} />
      </div>
      <div style={{ display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap' }}>
        <button style={quick} disabled={busy} onClick={()=>extend(7)}>+7d</button>
        <button style={quick} disabled={busy} onClick={()=>extend(14)}>+14d</button>
        <button style={quick} disabled={busy} onClick={()=>extend(30)}>+30d</button>
        {dirty && (
          <button disabled={busy} onClick={()=>onSave(val || null)}
            style={{ ...quick, marginLeft:'auto', color:'var(--orange-light)', borderColor:'rgba(249,115,22,.4)' }}>
            {busy ? 'Saving…' : 'Save date'}
          </button>
        )}
      </div>
    </div>
  )
}

function PlanSelect({label,value,options,onChange,disabled}) {
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px'}}>
      <span style={{fontSize:'12px',color:'var(--text3)',fontWeight:600}}>{label}</span>
      <select value={value} disabled={disabled}
        onChange={e=>onChange(e.target.value)}
        style={{ flex:'0 0 110px', background:'var(--surface2)', color:'var(--text)', border:'1px solid var(--border-light)', borderRadius:'8px', padding:'8px', fontSize:'12.5px', fontWeight:600, cursor:disabled?'wait':'pointer', opacity:disabled?0.5:1, textTransform:'capitalize' }}>
        {options.map(o => <option key={o} value={o} style={{textTransform:'capitalize'}}>{o}</option>)}
      </select>
    </div>
  )
}
function Chip({children,active,onClick,color}) { return <button onClick={onClick} style={{ fontSize:'13px', fontWeight:700, padding:'9px 14px', borderRadius:'10px', cursor:'pointer', background: active?'var(--surface3)':'var(--surface)', color: active?(color||'var(--text)'):'var(--text2)', border:'1px solid '+(active?'var(--border-light)':'var(--border)'), whiteSpace:'nowrap' }}>{children}</button> }
function Field({label,value,onChange,type,onEnter,autoComplete}) {
  return (
    <div style={{ marginBottom:'14px' }}>
      <label style={{ display:'block', fontSize:'12px', color:'var(--text3)', fontWeight:600, marginBottom:'6px' }}>{label}</label>
      <input
        type={type||'text'} value={value} autoComplete={autoComplete}
        onChange={e=>onChange(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter' && onEnter) onEnter() }}
        style={{ width:'100%', background:'var(--surface2)', border:'1px solid var(--border-light)', borderRadius:'10px', padding:'11px 13px', color:'var(--text)', fontSize:'14px', fontFamily:'Manrope, sans-serif' }}
      />
    </div>
  )
}

function AdminModal({ callFn, onClose }) {
  const [admins, setAdmins] = useState([])
  const [loading, setLoading] = useState(true)
  const [email, setEmail] = useState('')
  const [pw, setPw] = useState('')
  const [msg, setMsg] = useState('')
  const [working, setWorking] = useState(false)

  // Esc closes the modal
  useEffect(() => {
    const fn = e => { if (e.key === 'Escape') onClose() }
    window.addEventListener('keydown', fn)
    return () => window.removeEventListener('keydown', fn)
  }, [])

  const load = async () => {
    setLoading(true)
    const res = await callFn({ action: 'list-admins' }).catch(() => null)
    if (res && res.admins) setAdmins(res.admins)
    else if (res && res.error) setMsg(res.error)
    setLoading(false)
  }
  useEffect(() => { load() }, [])

  const add = async () => {
    setMsg(''); setWorking(true)
    const res = await callFn({ action: 'add-admin', email: email.trim(), password: pw }).catch(() => ({ error: 'Network error' }))
    setWorking(false)
    if (res && res.error) { setMsg(res.error); return }
    setMsg(res.created ? 'New admin login created and granted.' : 'Existing user granted admin.')
    setEmail(''); setPw(''); await load()
  }

  const remove = async (e) => {
    if (!confirm(`Remove admin access for ${e}? Their login stays, but they lose /platform access.`)) return
    setWorking(true)
    const res = await callFn({ action: 'remove-admin', email: e }).catch(() => ({ error: 'Network error' }))
    setWorking(false)
    if (res && res.error) { setMsg(res.error); return }
    await load()
  }

  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.6)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000, padding:'20px' }}>
      <div onClick={e=>e.stopPropagation()} style={{ ...card, width:'100%', maxWidth:'460px', maxHeight:'85vh', overflowY:'auto' }} className="fade-in card-pad">
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'18px' }}>
          <div style={{ fontSize:'18px', fontWeight:800 }}>Platform admins</div>
          <button onClick={onClose} style={{ ...btnSec, padding:'6px 12px' }}>✕</button>
        </div>

        {/* current admins */}
        {loading ? <div style={{color:'var(--text3)',fontSize:'13px'}}>Loading…</div> : (
          <div style={{ display:'grid', gap:'8px', marginBottom:'22px' }}>
            {admins.map(a => (
              <div key={a.email} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:'10px', padding:'10px 12px', gap:'8px' }}>
                <span style={{ fontSize:'13.5px', wordBreak:'break-all' }}>{a.email}</span>
                <button onClick={()=>remove(a.email)} disabled={working}
                  style={{ ...btnSec, padding:'5px 10px', color:'var(--red)', borderColor:'rgba(239,68,68,.3)', flexShrink:0 }}>Remove</button>
              </div>
            ))}
          </div>
        )}

        {/* add new */}
        <div style={{ borderTop:'1px solid var(--border)', paddingTop:'18px' }}>
          <div style={{ fontWeight:700, fontSize:'14px', marginBottom:'12px' }}>Add an admin</div>
          <Field label="Email" value={email} onChange={setEmail} type="email" />
          <Field label="Password (only needed if they have no login yet)" value={pw} onChange={setPw} type="password" />
          {msg && <div style={{ fontSize:'13px', color: msg.includes('granted')||msg.includes('created') ? 'var(--green)':'var(--red)', margin:'2px 0 12px' }}>{msg}</div>}
          <button onClick={add} disabled={working || !email.trim()}
            style={{ width:'100%', background:'linear-gradient(135deg, var(--orange), var(--amber))', color:'#fff', fontWeight:800, fontSize:'14px', padding:'11px', borderRadius:'10px', border:'none', cursor:'pointer', opacity:(working||!email.trim())?0.6:1 }}>
            {working ? 'Working…' : 'Add admin'}
          </button>
          <div style={{ fontSize:'11.5px', color:'var(--text3)', marginTop:'10px', lineHeight:1.5 }}>
            If the email already has an Alzaro login, just leave the password blank — we'll grant admin to their existing account. Otherwise set a password to create their login.
          </div>
        </div>
      </div>
    </div>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<Platform />)
  </script>
</body>
</html>
